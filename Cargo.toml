[package]
name = "horizon-mod-menu"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A sandboxed installed-mod browser for Horizon"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
horizon-mod-sdk = { git = "https://github.com/horizon-rust/horizon", rev = "83f15fa276c44711276b6ceb5f0fe0c9c534dc66" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
